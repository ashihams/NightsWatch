# Local n8n for Loop CRM webhooks (replaces mock :5678 when running).
# Usage:
#   docker compose -f infra/n8n/docker-compose.yml up -d
#   pwsh -File infra/n8n/import-workflows.ps1
# Then set TOOLS_BASE_URL=http://127.0.0.1:5678

services:
  n8n:
    image: n8nio/n8n:1.109.1
    container_name: loop-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=127.0.0.1
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_LISTEN_ADDRESS=0.0.0.0
      - WEBHOOK_URL=http://127.0.0.1:5678/
      - GENERIC_TIMEZONE=Asia/Kolkata
      - TZ=Asia/Kolkata
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_ENCRYPTION_KEY=loop-local-dev-encryption-key-32b
      - N8N_USER_MANAGEMENT_DISABLED=true
    volumes:
      - loop_n8n_data:/home/node/.n8n
      - ../../n8n-workflows:/workflows:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  loop_n8n_data:
