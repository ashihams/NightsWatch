<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nights Watch — demo dashboard</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <h1>Nights Watch</h1>
      <p class="sub">
        Learning trajectory + semantic lessons
        <span id="status" class="status">loading…</span>
      </p>
    </header>

    <main>
      <section aria-labelledby="traj-heading">
        <h2 id="traj-heading">Trajectory</h2>
        <p class="hint">seen_a → seen_b → unseen from the latest <code>npm run replay:demo</code></p>
        <div id="trajectory-panel" class="panel">Loading…</div>
      </section>

      <section aria-labelledby="lessons-heading">
        <h2 id="lessons-heading">Lessons</h2>
        <p class="hint">Usable = evidence_count ≥ 2 · Pending = candidates still gathering evidence</p>
        <div id="lessons-panel" class="panel">Loading…</div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
